# Conventional-commit PR titles and no AI attribution, via the org's reusable
# workflow. The scopes are the parts of the site (the page, its assets, the
# project catalog on it, the crawler files) plus deps and github.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    uses: The-Fisher-Slopworks-Co/.github/.github/workflows/pr-title.yml@main
    with:
      scopes: |
        page
        assets
        catalog
        seo
        deps
        github
