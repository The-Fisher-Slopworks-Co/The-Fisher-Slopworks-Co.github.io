<!--
  Social card, cut from the same instrument panel as the page: flat ink, hairline
  rules, one signal colour, monospace on every value. No gradient, no glow.

  Archivo and IBM Plex Mono lead each font stack so a machine that has them
  renders the real thing; the Liberation / Noto / DejaVu fallbacks behind them
  are what actually rasterises og.png here.

  Nothing on this card counts anything. Repository and language totals belong on
  the page, where catalog-sync refreshes them; a social card is cached by every
  platform that scrapes it, so a number baked in here goes stale somewhere we
  cannot reach to correct it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <rect width="1200" height="630" fill="#071522"/>

  <!-- ============ bar ============ -->
  <circle cx="93" cy="43" r="21" fill="#0a1a2b" stroke="#21394d"/>
  <g transform="translate(78,28) scale(0.30)" fill="none" stroke="#e7eef1"
     stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19,50 C31,31 55,29 71,48"/>
    <path d="M19,50 C31,69 55,71 71,52"/>
    <path d="M71,48 L89,37 L81,50 L89,63 L71,52"/>
    <path d="M37,35.9 C33,44 33,56 37,64.1"/>
  </g>
  <text x="130" y="51" font-family="'IBM Plex Mono','Noto Sans Mono','DejaVu Sans Mono',monospace"
        font-size="21" font-weight="500" letter-spacing="2.1" fill="#e7eef1">FISHER SLOPWORKS <tspan fill="#6f8698">CO.</tspan></text>
  <path d="M0,86.5 H1200" stroke="#16293a"/>

  <!-- ============ section marker, exactly as the page sets it ============ -->
  <text x="72" y="196" font-family="'IBM Plex Mono','Noto Sans Mono','DejaVu Sans Mono',monospace"
        font-size="17" font-weight="500" letter-spacing="3.4" fill="#6f8698">EST. 2026 / A FREE-SOFTWARE FOUNDRY</text>
  <path d="M578,190.5 H860" stroke="#16293a"/>

  <!-- ============ headline ============ -->
  <g font-family="Archivo,'Liberation Sans','Noto Sans','DejaVu Sans',sans-serif"
     font-size="74" font-weight="600" letter-spacing="-1.8" fill="#e7eef1">
    <text x="72" y="308">Small, sharp tools.</text>
    <text x="72" y="394">We let them <tspan fill="#46e5c4">swim.</tspan></text>
  </g>
  <text x="72" y="456" font-family="Archivo,'Liberation Sans','Noto Sans','DejaVu Sans',sans-serif"
        font-size="26" fill="#92a6b5">Free software, written by machine, shipped in the open.</text>

  <!-- ============ maker's mark ============ -->
  <circle cx="1016" cy="320" r="112" fill="#0a1a2b" stroke="#21394d"/>
  <g transform="translate(897.2,210) scale(2.2)" fill="none" stroke="#e7eef1"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19,50 C31,31 55,29 71,48"/>
    <path d="M19,50 C31,69 55,71 71,52"/>
    <path d="M71,48 L89,37 L81,50 L89,63 L71,52"/>
    <path d="M37,35.9 C33,44 33,56 37,64.1"/>
    <!-- the catch: a small fish held within -->
    <g transform="translate(-4,4)" stroke-width="1.9">
      <path d="M47,53 C51,48 58,48 62,52 C58,57 51,57 47,53 Z"/>
      <path d="M62,52 L67,49 L65,52 L67,55 Z" fill="#e7eef1"/>
    </g>
    <circle cx="30" cy="46.5" r="2.4" fill="#e7eef1" stroke="none"/>
  </g>

  <!-- ============ credit line ============ -->
  <path d="M72,554.5 H1128" stroke="#16293a"/>
  <text x="72" y="592" font-family="'IBM Plex Mono','Noto Sans Mono','DejaVu Sans Mono',monospace"
        font-size="19" letter-spacing="1.5" fill="#6f8698">slopworks.org &#160;&#183;&#160; AGPL-3.0-or-later &#160;&#183;&#160; REUSE-compliant</text>
</svg>
